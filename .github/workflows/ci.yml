name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg17-trixie
        env:
          POSTGRES_USER: code_to_rag
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: code_to_rag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U code_to_rag -d code_to_rag_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://code_to_rag:ci-password@localhost:5432/code_to_rag_test
    steps:
      - uses: actions/checkout@v5
      # pnpm must be on PATH before setup-node: it enables pnpm caching automatically from `packageManager`.
      # The pnpm version comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24.22.1
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Unit tests
        run: pnpm vitest run --project unit
      - name: Integration tests (PostgreSQL + pgvector)
        run: pnpm vitest run --project integration
      - name: Build
        run: pnpm build
      - name: License check (distributed code)
        run: pnpm licenses:check
      - name: License report (all installed packages)
        run: pnpm licenses:report
